<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DonutChart - preview</title>
<style>
body{padding:var(--space-4)}body{padding:var(--space-8) var(--space-16)}
</style>
</head>
<body>
<div class="cyp-donut">
 <svg viewBox="0 0 240 240" role="img" aria-label="Meals served by centre: Luigi 30%, Minsundu 45%, Nkwazi Centre 25%">
  <circle class="cyp-c-luigi" cx="120" cy="120" r="98" pathLength="100" stroke-dasharray="30 70" stroke-dashoffset="0"/>
  <circle class="cyp-c-minsundu" cx="120" cy="120" r="98" pathLength="100" stroke-dasharray="45 55" stroke-dashoffset="-30"/>
  <circle class="cyp-c-nkwazi" cx="120" cy="120" r="98" pathLength="100" stroke-dasharray="25 75" stroke-dashoffset="-75"/>
 </svg>
 <div>
  <h3 class="heading-2" style="margin:0 0 var(--space-4)">Meals served by centre</h3>
  <ul class="cyp-legend">
   <li class="cyp-c-luigi"><i class="cyp-swatch"></i><span class="label-caps">Luigi</span><b>30%</b></li>
   <li class="cyp-c-minsundu"><i class="cyp-swatch"></i><span class="label-caps">Minsundu</span><b>45%</b></li>
   <li class="cyp-c-nkwazi"><i class="cyp-swatch"></i><span class="label-caps">Nkwazi Centre</span><b>25%</b></li>
  </ul>
  <p class="caption cyp-caption"><b>Figure 3:</b> Share of plates served, by centre. Sample figures, for layout only.</p>
 </div>
</div>
