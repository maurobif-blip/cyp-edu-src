<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SyncBanner - preview</title>
<style>
body{padding:var(--space-4)}
</style>
</head>
<body>
<div style="width:360px;display:grid;gap:var(--space-2)">
 <div class="cyp-banner cyp-banner--warn"><svg class="cyp-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h.01"/> <path d="M8.5 16.429a5 5 0 0 1 7 0"/> <path d="M5 12.859a10 10 0 0 1 5.17-2.69"/> <path d="M19 12.859a10 10 0 0 0-2.007-1.523"/> <path d="M2 8.82a15 15 0 0 1 4.177-2.643"/> <path d="M22 8.82a15 15 0 0 0-11.288-3.764"/> <path d="m2 2 20 20"/></svg>No internet. Saved on this phone. It will send by itself.</div>
 <div class="cyp-banner cyp-banner--ok"><svg class="cyp-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/> <path d="m9 12 2 2 4-4"/></svg>Saved and sent.</div>
 <div class="cyp-banner cyp-banner--danger"><svg class="cyp-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/> <path d="m15 9-6 6"/> <path d="m9 9 6 6"/></svg>Not saved. Tap Save again.</div>
</div>
