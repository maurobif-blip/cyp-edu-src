 <a class="cyp-row cyp-row--link" href="#"><span class="cyp-disc cyp-disc--sm cyp-c-blue"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/> <path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/> <path d="M12 17.5v-11"/></svg></span><span class="cyp-row__text"><b>Mealie meal, 10 bags</b><span>Sent 20/11/2026</span></span><span class="cyp-tag cyp-tag--warn"><svg class="cyp-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/> <polyline points="12 6 12 12 16 14"/></svg>Waiting</span><svg class="cyp-icon cyp-go" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></a>
